# Impede que o Supabase (plano gratuito) pause o projeto por inatividade:
# ele pausa depois de 7 dias sem uso. A cada 2 dias isto chama a função
# keepalive() (supabase/migrations/0022_keepalive.sql), que faz uma consulta
# real no banco sem expor nenhum dado.
#
# Precisa de dois secrets no repositório (Settings → Secrets and variables →
# Actions): SUPABASE_URL e SUPABASE_ANON_KEY — os mesmos valores de
# NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY do .env.local.
#
# Atenção: o GitHub só roda workflows agendados que estão na branch padrão
# (main).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 12 */2 * *" # a cada 2 dias, 09:17 em Brasília
  workflow_dispatch: # botão "Run workflow" para testar na mão

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY."
            exit 1
          fi
          status=$(curl -sS -o response.txt -w "%{http_code}" --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status: $(cat response.txt)"
          # Falhar de propósito: o GitHub manda e-mail quando um workflow falha,
          # então um projeto que já foi pausado não passa despercebido.
          [ "$status" = "200" ]
