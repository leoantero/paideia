<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barra inferior</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Young+Serif&amp;family=Marcellus&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Navegação principal" style="width: 390px; height: 72px; box-sizing: border-box; display: flex; padding: 0 4px 8px; background: #ffffff; border-top: 1px solid #e2e0d9; font-family: Manrope, system-ui, sans-serif; color: #151b2e">
<sc-for list="{{items}}" as="item" hint-placeholder-count="6">
<a href="{{item.href}}" aria-current="{{item.current}}" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10.5px; color: {{item.color}}; font-weight: {{item.weight}}">
<span style="width: 22px; height: 3px; margin-bottom: 7px; border-radius: 0 0 2px 2px; background: {{item.bar}}"></span>
<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span style="white-space: nowrap">{{item.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ativo":{"editor":"enum","options":["inicio","tutor","revisar","questoes","simulacao","podio"],"default":"inicio"},"$preview":{"width":390,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const ativo = this.props.ativo ?? 'inicio';
const base = [
{ id: 'inicio', label: 'Início', href: 'TelaInicio.dc.html', d: 'M3 9 12 4l9 5zM4.5 11h15M4 20.5h16M5 18.5h14M7 11v7.5M12 11v7.5M17 11v7.5' },
{ id: 'tutor', label: 'Tutor', href: 'TelaTutor.dc.html', d: 'M5 9c0-3.3 3-5.5 7-5.5S19 5.7 19 9v5.5c0 3.6-3.1 6.5-7 6.5s-7-2.9-7-6.5zM7.2 10.5a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12.8 10.5a2 2 0 1 0 4 0a2 2 0 1 0-4 0M11.2 14l.8 1.2.8-1.2' },
{ id: 'revisar', label: 'Revisar', href: 'TelaRevisao.dc.html', d: 'M4 5.5A1.5 1.5 0 0 1 5.5 4h7A1.5 1.5 0 0 1 14 5.5v12a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 4 17.5zM14 7h4.5A1.5 1.5 0 0 1 20 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-7a1.5 1.5 0 0 1-1.5-1.5V19M7 8h4M7 11h4' },
{ id: 'questoes', label: 'Questões', href: 'TelaQuestoes.dc.html', d: 'M6 3.5h9l3 3v14H6zM15 3.5v3h3M9 11l1.6 1.6L14 9.2M9 16.5h6' },
{ id: 'simulacao', label: 'Simulação', href: 'TelaSimulacoes.dc.html', d: 'M3.5 5.5h17v13h-17zM10 9.2v5.6l4.8-2.8z' },
{ id: 'podio', label: 'Pódio', href: 'TelaPodio.dc.html', d: 'M7 4h10v5a5 5 0 0 1-10 0zM7 5.5H4.5a2.2 2.2 0 0 0 2.6 3.6M17 5.5h2.5a2.2 2.2 0 0 1-2.6 3.6M12 14v3.5M8.5 20.5h7M9.5 17.5h5v3h-5z' }
];
return {
items: base.map((it) => {
const on = it.id === ativo;
return { ...it, current: on ? 'page' : null, color: on ? '#151b2e' : '#5c6279', weight: on ? 800 : 600, bar: on ? '#1c2a4a' : 'transparent' };
})
};
}
}
</script>
</body>
</html>
