<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        />
        <style>
          :root {
            --bg: #f4f9fa;
            --surface: #fff;
            --parchment: #fffac8;
            --gold-soft: #f7e9a8;
            --ink: #1e3a8a;
            --gold: #e4bb02;
            --body: #1f2937;
            --muted: #5b6672;
            --line: #d7e3e5;
            --radius: 12px;
            --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
            --sans: "Inter", system-ui, sans-serif;
          }
          * {
            box-sizing: border-box;
          }
          body {
            margin: 0;
            background: var(--bg);
            color: var(--body);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
          }
          h1 {
            font-family: var(--display);
            color: var(--ink);
            letter-spacing: -0.01em;
            margin: 0;
            font-size: 20px;
            font-weight: 600;
          }
          .shell {
            width: 390px;
            margin: 0 auto;
            min-height: 100%;
            background: var(--bg);
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
          }
          .main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
          }
          .ptitle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
          }
          .ptitle .q {
            margin-left: auto;
            font-family: var(--display);
            font-size: 24px;
            font-weight: 600;
            color: rgba(228, 187, 2, 0.3);
            user-select: none;
          }
          .card {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 1px 2px rgba(30, 58, 138, 0.06);
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
          }
          .callout {
            border: 1px solid var(--gold-soft);
            background: var(--parchment);
            border-radius: var(--radius);
            padding: 16px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--body);
          }
          .nav {
            position: sticky;
            bottom: 0;
            border-top: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.95);
            display: flex;
          }
          .nav a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 0;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
          }
          .nav a.active {
            color: var(--ink);
          }
          .nav svg {
            width: 24px;
            height: 24px;
          }
        </style>
      </helmet>

      <div class="shell">
        <div class="main">
          <div class="ptitle">
            <h1>Turma</h1>
            <span class="q">?</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 16px">
            <div class="card">
              <span style="font-size: 14px; font-weight: 600; color: var(--ink)"
                >8º ano B</span
              >
              <span style="font-size: 12px; color: var(--muted)">2026</span>
            </div>
            <div class="callout">
              O mapa de calor turma × conceito e o diagnóstico de pré-requisito
              por aluno entram aqui, assim que houver evidência de aprendizagem
              registrada. Em construção.
            </div>
          </div>
        </div>

        <nav class="nav">
          <a class="active"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" /></svg
            >Turma</a
          >
          <a
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.63.77 1.06 1.44 1.09H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
              /></svg
            >Ajustes</a
          >
        </nav>
      </div>
    </x-dc>
  </body>
</html>
